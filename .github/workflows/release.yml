name: Release

# Runs when a v* tag reaches GitHub. The tag is created and pushed to Forgejo, and its push mirror
# brings it here. Creating the tag from this workflow would put it only on GitHub, and the next
# mirror run would delete it and turn the release back into a draft.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $version" }
          echo "VERSION=$version" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Windows binaries
        run: bun run build:win
        env:
          GH_TOKEN: ""
          # Baked into the bundle at build time. Without it the published build
          # simply skips identifying audio by its sound, silently, so a missing
          # secret costs a feature rather than a failed build.
          MAIN_VITE_ACOUSTID_KEY: ${{ secrets.ACOUSTID_CLIENT_KEY }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:TAG" `
            --title "VLC Discord RP $env:TAG" `
            --notes "See [CHANGELOG.md](https://github.com/valentin-marquez/vlc-rpc/blob/main/CHANGELOG.md) for detailed changes." `
            "dist/vlc-rpc-$env:VERSION-setup.exe" `
            "dist/vlc-rpc-$env:VERSION-setup.exe.blockmap" `
            "dist/vlc-rpc-$env:VERSION-portable.exe" `
            dist/latest.yml `
            --latest
        shell: pwsh
